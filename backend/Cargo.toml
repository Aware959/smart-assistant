[package]
name = "smart-assistant"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
crate-type = ["cdylib", "lib"]
name = "smart_assistant"

[[bin]]
name = "smart-assistant-server"
path = "src/bin/smart-assistant-server.rs"
required-features = ["desktop"]

[[bin]]
name = "smart-assistant-cli"
path = "src/bin/smart-assistant-cli.rs"
required-features = ["desktop"]

# 记忆向量维护工具：与主程序解耦，负责巡检与确认重建（仅依赖核心库，无需 desktop）
[[bin]]
name = "smart-assistant-memory"
path = "src/bin/smart-assistant-memory.rs"

[dependencies]
# UniFFI
uniffi = { version = "0.28", features = ["cli"] }

# SQLite
rusqlite = { version = "0.37", features = ["bundled", "vtab", "backup"] }

# 向量搜索
sqlite-vec = "0.1"

# LLM API 调用（多厂商适配）
genai = "0.6"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步流 (SSE 实时输出)
futures = "0.3"

# 异步运行时 (genai 需要；本库通过全局 runtime 以同步接口暴露)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }

# Web 框架 (desktop 调试用)
axum = { version = "0.8", features = ["ws", "json"], optional = true }
# TLS 支持：以 HTTPS 暴露 API（自签名证书见 scripts/gen-cert.ps1）
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
# 静态文件托管：由后端直接提供前端 build 产物 (SPA)
tower-http = { version = "0.6", features = ["fs"], optional = true }

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Ctrl+C 优雅退出（CLI）
ctrlc = "3"

# .env 文件加载（server / cli 启动时）
dotenvy = "0.15"

# Telegram Bot API 调用（channels/telegram 长轮询）
reqwest = { version = "0.12", optional = true, features = ["json"] }
# 微信 iLink 通道：base64（X-WECHAT-UIN）+ 终端二维码渲染（扫码登录）
base64 = { version = "0.22", optional = true }
qrcode = { version = "0.14", optional = true }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[features]
default = ["desktop", "telegram", "ilink"]
desktop = ["axum", "axum-server", "tower-http", "tracing-subscriber"]
telegram = ["dep:reqwest"]
ilink = ["dep:reqwest", "dep:base64", "dep:qrcode"]

[profile.release]
lto = true
opt-level = 3
