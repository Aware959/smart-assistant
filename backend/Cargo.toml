[package]
name = "smart-assistant"
version = "0.2.0"
edition = "2021"
autobins = false

[lib]
crate-type = ["lib"]
name = "smart_assistant"

# 通道守护进程：telegram / iLink 长轮询 + 意图主动开口（依赖 telegram + ilink）
[[bin]]
name = "zhiwei-service"
path = "src/bin/zhiwei-service.rs"
required-features = ["telegram", "ilink"]

# 运维 CLI：数据库、贴纸、动态配置；不参与对话
[[bin]]
name = "zhiwei-cli"
path = "src/bin/zhiwei-cli.rs"

[dependencies]
# SQLite
rusqlite = { version = "0.37", features = ["bundled", "vtab", "backup"] }

# 向量搜索
sqlite-vec = "0.1"

# LLM API 调用（多厂商适配）
genai = "0.6"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步流 (SSE 实时输出)
futures = "0.3"

# 异步运行时 (genai 需要；本库通过全局 runtime 以同步接口暴露)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }

# HTTP 框架：zhiwei-service 的本地控制接口
axum = { version = "0.8", features = ["ws", "json"] }

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志（zhiwei-service / zhiwei-cli 共用运行时启动脚手架，故不做可选特性）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = { version = "0.2" }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Ctrl+C 优雅退出（CLI）
ctrlc = "3"

# .env 文件加载（server / cli 启动时）
dotenvy = "0.15"

# Telegram Bot API 调用（channels/telegram 长轮询）；multipart 用于上传生成的图片/语音字节
reqwest = { version = "0.12", optional = true, features = ["json", "multipart"] }
# base64：微信 iLink 通道的 X-WECHAT-UIN 头 + MCP 协议的二进制内容块
base64 = "0.22"
# 终端二维码渲染（扫码登录）
qrcode = { version = "0.14", optional = true }

[features]
default = ["telegram", "ilink", "mcp-http"]
telegram = ["dep:reqwest"]
ilink = ["dep:reqwest", "dep:qrcode"]
# MCP 的 Streamable HTTP 传输（stdio 传输不依赖任何外部 crate）
mcp-http = ["dep:reqwest"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
opt-level = 3

# 构建体积优化（dev/test）
[profile.dev]
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0
