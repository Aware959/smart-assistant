<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13221d" />
    <title>知微 Zhiwei</title>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-orbit"></span>
          <span class="brand-seed"></span>
        </div>
        <div>
          <p class="eyebrow">见微知著</p>
          <h1>知微 <span>Zhiwei</span></h1>
        </div>
        <p class="version" id="version">桌面试运行</p>
      </header>

      <section class="status-card" aria-labelledby="service-title">
        <div class="status-heading">
          <div>
            <p class="section-label">TELEGRAM SERVICE</p>
            <h2 id="service-title">通道守护</h2>
          </div>
          <div class="phase-badge" id="phase-badge">
            <span class="phase-dot" id="phase-dot"></span>
            <span id="phase-text">正在读取</span>
          </div>
        </div>
        <p class="status-message" id="status-message">正在连接桌面壳……</p>
        <dl class="status-grid">
          <div>
            <dt>进程 PID</dt>
            <dd id="pid">—</dd>
          </div>
          <div>
            <dt>自动恢复</dt>
            <dd id="auto-restart">—</dd>
          </div>
          <div>
            <dt>重试次数</dt>
            <dd id="restart-attempts">—</dd>
          </div>
        </dl>
        <div class="actions">
          <button class="primary" type="button" data-action="start_service">启动服务</button>
          <button type="button" data-action="restart_service">重启服务</button>
          <button type="button" data-action="stop_service">停止服务</button>
        </div>
      </section>

      <section class="settings-card" aria-labelledby="settings-title">
        <div class="detail-heading">
          <div>
            <p class="section-label">RUNTIME SETTINGS</p>
            <h2 id="settings-title">运行时配置</h2>
          </div>
          <p id="settings-revision">revision —</p>
        </div>
        <p class="status-message" id="settings-message">正在读取数据库配置……</p>
        <div class="settings-grid" id="settings-grid"></div>
        <div class="actions">
          <button class="primary" id="save-settings" type="button">保存运行配置</button>
          <button id="reload-settings" type="button">重新读取</button>
        </div>
      </section>

      <section class="details">
        <div class="detail-heading">
          <div>
            <p class="section-label">LOCAL FILES</p>
            <h2>本机配置</h2>
          </div>
          <p>`.env` 只保留启动配置与密钥；运行策略已迁移到数据库，由 `zhiwei-service` 控制接口管理。</p>
        </div>
        <div class="path-row">
          <div>
            <span>程序</span>
            <code id="zhiwei-service-path">—</code>
          </div>
          <button class="text-button" type="button" data-command="open_data_folder">打开目录</button>
        </div>
        <div class="path-row">
          <div>
            <span>控制状态</span>
            <code id="control-state-file">—</code>
          </div>
        </div>
        <div class="path-row">
          <div>
            <span>配置</span>
            <code id="env-file">—</code>
          </div>
          <button class="text-button" type="button" data-command="open_env_file_command">编辑配置</button>
        </div>
        <div class="path-row">
          <div>
            <span>日志</span>
            <code id="log-file">—</code>
          </div>
          <button class="text-button" type="button" data-command="open_log_file">查看日志</button>
        </div>
      </section>

      <footer>
        <span>关闭此窗口只会隐藏到托盘。</span>
        <span>右键托盘图标可快速重启或退出。</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
